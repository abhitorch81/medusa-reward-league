# Free demo: rooms reset on restarts, redeploys and spin-down.
services:
  - type: web
    name: medusa-reward-league
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /tmp/medusa/derby.sqlite
